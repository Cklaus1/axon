name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runs any branch on demand: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Host-scoped, the way gate.sh scopes its flags: a set RUSTFLAGS (even "")
  # replaces `[target.wasm32-*].rustflags` in .cargo/config.toml (the 64 MiB wasm
  # stack) and would turn wasm32-only warnings into errors.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -D warnings

jobs:
  # Pure-text hygiene gates: ~1s, no build, no toolchain beyond bash+jq.
  # `claims_gate` is NOT here: it needs ./target/debug/axon to check that every
  # verb CLAUDE.md names exists, and SKIPS that check when the binary is absent
  # while still exiting 0. Running it in a build-less job would have reported
  # green having verified nothing — so it runs in check-and-test below, after
  # the binary exists, with CLAIMS_GATE_REQUIRE=1 so the skip becomes fatal.
  # They existed and NOTHING RAN THEM — the same reason a clippy error in
  # axon-rt lived on a branch for nine days with CI green. `verify_all_specs`
  # is what makes a spec's `evidence:` line mean something; `claims_gate` is
  # what keeps CLAUDE.md's mechanically-checkable claims true; the DAG check
  # catches spec cycles and `blocked-by` pointers at questions already resolved.
  docs-and-specs:
    name: Docs & spec hygiene (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Spec metadata is valid
        run: bash scripts/verify_all_specs.sh --export-jsonl governance/state/specs.jsonl

      - name: Spec DAG has no cycles or stale blocked-by
        run: bash scripts/r39_slice5_dag_check.sh

  check-and-test:
    name: Check & Test (no LLVM)
    runs-on: ubuntu-latest

    steps:
      # Full history: pci_delta_note and spec_ledger resolve real commits and
      # ancestry (a depth-1 clone fails them with "unknown revision").
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      # Cache cargo registry + compiled deps. The key includes the OS, the
      # TOOLCHAIN FILE and Cargo.lock, so bumping the pin cannot restore objects
      # built by the previous rustc. (This comment claimed a toolchain hash
      # before there was one to hash.)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fast type-check — the codegen feature requires LLVM 23, which this job
      # does not install (the `codegen` job below does), so we skip it here.
      - name: cargo check (no codegen)
        run: cargo check --no-default-features -p axon-core

      # Run the full unit + integration test suite.  Anything that lives
      # outside the codegen feature gate is exercised here, which covers
      # the lexer, parser, type-checker, and interpreter/evaluator.
      # --no-fail-fast: one failing test binary must not hide the rest.
      - name: cargo test (no codegen)
        run: cargo test --no-default-features -p axon-core --no-fail-fast

      # Format check — fails the build if any file needs reformatting. --all, not
      # -p axon-core: the per-crate scoping here is why 37 files of drift in the
      # other crates went unseen until 2980206 swept them.
      # Every step below runs even when the tests fail (`!cancelled()`), so fmt,
      # clippy and claims report on every run.
      - name: CLAUDE.md claims are true (binary exists by now)
        if: ${{ !cancelled() }}
        env:
          CLAIMS_GATE_REQUIRE: "1"
          # The binary THIS job built (claims_gate never falls back to target/).
          AXON: ./target/debug/axon
        run: bash scripts/claims_gate.sh

      - name: cargo fmt check
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      # Lint — only flag things that are also blocked by the host -D warnings.
      - name: cargo clippy (no codegen)
        if: ${{ !cancelled() }}
        run: cargo clippy --no-default-features -p axon-core -- -D warnings

      # The runtime crates. CI linted ONLY axon-core, so a clippy error in
      # axon-rt lived on the branch from 2026-09-08 to 2026-09-17 with every
      # CI run green — `scripts/gate.sh --strict` catches it, and CI does not
      # run gate.sh. The crate list mirrors gate.sh's, which now has its own
      # coverage check asserting every workspace member is gated or excused.
      # axon-guest-kernel is excluded: freestanding no_std, unlintable on the
      # host target (built by scripts/build-guest-image.sh with -Z build-std).
      - name: cargo clippy (runtime crates)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p axon-rt -p axon-rt-ai -p axon-ai -p axon-surface -p axon-gfx \
            -p axon-gfx-mock -p axon-domain -p axon-vm -p axon-attest \
            -p axon-ledger -p axon-intent -p axon-os -p axon-web \
            -p axon-audit -p axon-certcheck -p axon-signal \
            -p axon-guest-init -p axon-wasm --all-targets -- -D warnings

  # AUDIT T7. Every job above passes `-p axon-core`, so CI covered 1 of the 19
  # workspace crates. axon-os (the supervisor/gate), axon-attest, axon-vm,
  # axon-web, axon-guest-kernel and the rest were never built or tested by CI —
  # including the crates that hold the capability-enforcement code.
  #
  # The host rustflags are deliberately cleared for this job
  # (CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "", not RUSTFLAGS: "",
  # which would also drop the committed wasm32 flags). The workspace-wide
  # `-D warnings` from the top-level env would fail on pre-existing warnings in
  # crates that have never been lint-gated (unused imports in axon-os tests,
  # dead_code in axon-vm), turning a useful TEST signal into a lint failure.
  # Lint-gating the remaining crates is a separate, larger change — tracked
  # rather than bundled here, so this job reports what it actually measures.
  workspace-test:
    # No count in the name: it ran `cargo test --workspace`, which DISCOVERS
    # members, while the name asserted "19 crates" — a number nothing checks and
    # that goes wrong the moment a crate is added. The discovery is the truth.
    name: Test the whole workspace as root (no LLVM)
    # Pinned, not ubuntu-latest: the root suites depend on the kernel's ntfs3
    # module and on apt package names, and the runner's own annotation announces
    # the ubuntu-latest -> 26 migration.
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ws-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ws-

      # O-CI-02 (ci-hygiene NH-3 B): scripts/gate.sh runs every suite as root,
      # and these suites assert root rather than skip: mknod (cortex lib), the
      # ntfs3 loop mount (cortex cli N3), /etc/axon + chown (freeze_manifest),
      # /var/lib + mksquashfs (guest_build_env), fanotify (one_read), chown
      # (protected_host, launcher_isolation), DAC override (psv protocol).
      # Nothing is skipped or ignored; this job gives them what the gate gives.
      # apt retried as in the codegen job: a DNS failure in `apt-get update`
      # prints only W: lines and exits 0, so the install is inside the loop.
      - name: Host prerequisites for the root suites
        shell: bash
        run: |
          install_pkgs() {
            sudo apt-get update &&
            sudo apt-get install -y squashfs-tools ntfs-3g e2fsprogs
          }
          for k in 1 2 3; do
            if install_pkgs; then break; fi
            echo "apt attempt $k failed"
            if [ "$k" = 3 ]; then exit 1; fi
            sleep 20
          done
          sudo modprobe ntfs3 || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe ntfs3; }
          # Empty and root-owned: the freeze and unattended tests mount a private
          # tmpfs over it inside `unshare -m` (scripts/gate.sh S09U requires it).
          sudo mkdir -p /etc/axon
          # root runs git against this runner-owned checkout.
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # scripts/guest_build_env.py resolves rustup from the euid's home
      # (/root/.cargo/bin/rustup) and refuses a toolchain tree that is not
      # root-owned or is group/other-writable; the controlled guest build also
      # needs the musl target, which rust-toolchain.toml does not list.
      - name: Root's own copy of the pinned toolchain (+ musl)
        shell: bash
        run: |
          sudo mkdir -p /root/.cargo
          sudo cp -a "$HOME/.cargo/bin" /root/.cargo/
          sudo cp -a "$HOME/.rustup" /root/
          sudo chown -R root:root /root/.cargo /root/.rustup
          sudo chmod -R go-w /root/.cargo /root/.rustup
          for k in 1 2 3; do
            if sudo env HOME=/root PATH=/root/.cargo/bin:/usr/bin:/bin rustup target add x86_64-unknown-linux-musl; then break; fi
            echo "rustup attempt $k failed"
            if [ "$k" = 3 ]; then exit 1; fi
            sleep 20
          done

      # --no-default-features keeps LLVM out of this job; the codegen half is
      # covered by the `codegen` job below. As root, with root's home: the
      # freeze and guest-build suites key off the euid's home, so `sudo -E`
      # (which keeps HOME=/home/runner) is wrong. CARGO_HOME stays the runner's
      # so the cached registry is used; sudo's env_reset drops the job env, so
      # the empty host RUSTFLAGS is passed explicitly (empty and unset differ).
      - name: cargo test --workspace as root (no codegen)
        run: |
          sudo env HOME=/root PATH="/root/.cargo/bin:$PATH" CARGO_HOME="$HOME/.cargo" \
            CARGO_TERM_COLOR=always CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS= \
            cargo test --workspace --no-default-features --no-fail-fast

      # Root wrote target/ and the registry; hand them back so the runner-user
      # cache save (only on a green job) can read them.
      - name: Hand the checkout and cargo home back to the runner user
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$HOME/.cargo"

  # AUDIT T7. The native/interp parity harnesses are the I-2 invariant this
  # project rests on, and NONE of them ran in CI — the codegen feature needs
  # LLVM, so it was skipped entirely and parity was only ever checked
  # locally. A parity invariant that no automation enforces is an aspiration.
  #
  # LLVM must be pinned to 23 from apt.llvm.org: inkwell's `llvm23-1` feature
  # links only LLVM 23, and the runner's Ubuntu archive does not carry it.
  codegen:
    # NAME CORRECTED 2026-09-17. It read "Codegen + native/interp parity" and
    # ran `cargo build` + `cargo test` — it has never invoked parity_all.sh or
    # any of the 53 *_parity.sh harnesses. So invariant I-2 (interp and codegen
    # agree byte-for-byte), the load-bearing property of this project, is NOT
    # enforced by CI; it is enforced by someone remembering to run
    # `scripts/parity_all.sh` locally. A job name is a claim, and this one was
    # false in the direction that matters.
    #
    # TO CLOSE THE GAP (a real decision, not an oversight to sweep up):
    #   - add a step `PARITY_SKIP_WASM=1 EXPECT_MIN_PASS=38 bash scripts/parity_all.sh`
    #   - 38 is MEASURED, not guessed: with the wasm harnesses skipped this box
    #     runs 38 passed / 15 skipped / 0 failed. The suite's default floor of 40
    #     rejects that run by design, which is why the override is required and
    #     why the script tells you to set it explicitly "and say why".
    #   - cost is ~15 min per run; the wasm tier additionally needs wasm targets,
    #     wasmtime and wasm-bindgen-test-runner (scripts/setup-environments.sh).
    #   - the first CI run IS the verification: these 38 pass on this box, and
    #     nobody has yet observed them on a GitHub runner.
    name: Codegen build + tests (LLVM 23) — NOT the parity suite
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Three attempts, 20 s apart, under pipefail (`shell: bash`): a DNS
      # failure inside `apt-get update` prints only W: lines and exits 0, so the
      # install is inside the loop too. The third failure fails the job.
      - name: Install LLVM 23
        shell: bash
        run: |
          install_llvm() {
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null &&
            codename="$(lsb_release -cs)" &&
            echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-23 main" \
              | sudo tee /etc/apt/sources.list.d/llvm-23.list &&
            sudo apt-get update &&
            sudo apt-get install -y llvm-23 llvm-23-dev libpolly-23-dev
          }
          for k in 1 2 3; do
            if install_llvm; then break; fi
            echo "apt attempt $k failed"
            if [ "$k" = 3 ]; then exit 1; fi
            sleep 20
          done
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cg-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cg-

      - name: cargo build (codegen)
        run: cargo build -p axon-core

      # The wasm32 runtime the wasm runnable-label test links against
      # (target/wasm32-unknown-unknown/debug/libaxon_rt.a, the first path searched).
      - name: cargo build axon-rt (wasm32-unknown-unknown)
        run: cargo build -p axon-rt --target wasm32-unknown-unknown

      # The parity + capability integration tests. This is the job that would
      # have caught the sandbox-escape defects this audit found by hand.
      - name: cargo test (codegen)
        run: cargo test -p axon-core --no-fail-fast
