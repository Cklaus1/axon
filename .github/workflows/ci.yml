name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Pure-text hygiene gates: ~1s, no build, no toolchain beyond bash+jq.
  # `claims_gate` is NOT here: it needs ./target/debug/axon to check that every
  # verb CLAUDE.md names exists, and SKIPS that check when the binary is absent
  # while still exiting 0. Running it in a build-less job would have reported
  # green having verified nothing — so it runs in check-and-test below, after
  # the binary exists, with CLAIMS_GATE_REQUIRE=1 so the skip becomes fatal.
  # They existed and NOTHING RAN THEM — the same reason a clippy error in
  # axon-rt lived on a branch for nine days with CI green. `verify_all_specs`
  # is what makes a spec's `evidence:` line mean something; `claims_gate` is
  # what keeps CLAUDE.md's mechanically-checkable claims true; the DAG check
  # catches spec cycles and `blocked-by` pointers at questions already resolved.
  docs-and-specs:
    name: Docs & spec hygiene (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Spec metadata is valid
        run: bash scripts/verify_all_specs.sh --export-jsonl governance/state/specs.jsonl

      - name: Spec DAG has no cycles or stale blocked-by
        run: bash scripts/r39_slice5_dag_check.sh

  check-and-test:
    name: Check & Test (no LLVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      # Cache cargo registry + compiled deps. The key includes the OS, the
      # TOOLCHAIN FILE and Cargo.lock, so bumping the pin cannot restore objects
      # built by the previous rustc. (This comment claimed a toolchain hash
      # before there was one to hash.)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fast type-check — the codegen feature requires LLVM 17 which is not
      # available on the GitHub-hosted runner, so we skip it here.
      - name: cargo check (no codegen)
        run: cargo check --no-default-features -p axon-core

      # Run the full unit + integration test suite.  Anything that lives
      # outside the codegen feature gate is exercised here, which covers
      # the lexer, parser, type-checker, and interpreter/evaluator.
      - name: cargo test (no codegen)
        run: cargo test --no-default-features -p axon-core

      # Format check — fails the build if any file needs reformatting. --all, not
      # -p axon-core: the per-crate scoping here is why 37 files of drift in the
      # other crates went unseen until 2980206 swept them.
      - name: CLAUDE.md claims are true (binary exists by now)
        env:
          CLAIMS_GATE_REQUIRE: "1"
        run: bash scripts/claims_gate.sh

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      # Lint — only flag things that are also blocked by RUSTFLAGS=-D warnings.
      - name: cargo clippy (no codegen)
        run: cargo clippy --no-default-features -p axon-core -- -D warnings

      # The runtime crates. CI linted ONLY axon-core, so a clippy error in
      # axon-rt lived on the branch from 2026-09-08 to 2026-09-17 with every
      # CI run green — `scripts/gate.sh --strict` catches it, and CI does not
      # run gate.sh. The crate list mirrors gate.sh's, which now has its own
      # coverage check asserting every workspace member is gated or excused.
      # axon-guest-kernel is excluded: freestanding no_std, unlintable on the
      # host target (built by scripts/build-guest-image.sh with -Z build-std).
      - name: cargo clippy (runtime crates)
        run: |
          cargo clippy -p axon-rt -p axon-ai -p axon-surface -p axon-gfx \
            -p axon-gfx-mock -p axon-domain -p axon-vm -p axon-attest \
            -p axon-ledger -p axon-intent -p axon-os -p axon-web \
            -p axon-audit -p axon-certcheck -p axon-signal \
            -p axon-guest-init -p axon-wasm --all-targets -- -D warnings

  # AUDIT T7. Every job above passes `-p axon-core`, so CI covered 1 of the 19
  # workspace crates. axon-os (the supervisor/gate), axon-attest, axon-vm,
  # axon-web, axon-guest-kernel and the rest were never built or tested by CI —
  # including the crates that hold the capability-enforcement code.
  #
  # RUSTFLAGS is deliberately cleared for this job. The workspace-wide
  # `-D warnings` from the top-level env would fail on pre-existing warnings in
  # crates that have never been lint-gated (unused imports in axon-os tests,
  # dead_code in axon-vm), turning a useful TEST signal into a lint failure.
  # Lint-gating the remaining crates is a separate, larger change — tracked
  # rather than bundled here, so this job reports what it actually measures.
  workspace-test:
    # No count in the name: it ran `cargo test --workspace`, which DISCOVERS
    # members, while the name asserted "19 crates" — a number nothing checks and
    # that goes wrong the moment a crate is added. The discovery is the truth.
    name: Test the whole workspace (no LLVM)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ws-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ws-

      # --no-default-features keeps LLVM out of this job; the codegen half is
      # covered by the `codegen` job below.
      - name: cargo test --workspace (no codegen)
        run: cargo test --workspace --no-default-features

  # AUDIT T7. The native/interp parity harnesses are the I-2 invariant this
  # project rests on, and NONE of them ran in CI — the codegen feature needs
  # LLVM 17, so it was skipped entirely and parity was only ever checked
  # locally. A parity invariant that no automation enforces is an aspiration.
  #
  # LLVM must be pinned to 17: the apt `llvm` metapackage resolves to 18, which
  # does not match inkwell 0.4's `llvm17-0` feature and fails to link.
  codegen:
    # NAME CORRECTED 2026-09-17. It read "Codegen + native/interp parity" and
    # ran `cargo build` + `cargo test` — it has never invoked parity_all.sh or
    # any of the 53 *_parity.sh harnesses. So invariant I-2 (interp and codegen
    # agree byte-for-byte), the load-bearing property of this project, is NOT
    # enforced by CI; it is enforced by someone remembering to run
    # `scripts/parity_all.sh` locally. A job name is a claim, and this one was
    # false in the direction that matters.
    #
    # TO CLOSE THE GAP (a real decision, not an oversight to sweep up):
    #   - add a step `PARITY_SKIP_WASM=1 EXPECT_MIN_PASS=38 bash scripts/parity_all.sh`
    #   - 38 is MEASURED, not guessed: with the wasm harnesses skipped this box
    #     runs 38 passed / 15 skipped / 0 failed. The suite's default floor of 40
    #     rejects that run by design, which is why the override is required and
    #     why the script tells you to set it explicitly "and say why".
    #   - cost is ~15 min per run; the wasm tier additionally needs wasm targets,
    #     wasmtime and wasm-bindgen-test-runner (scripts/setup-environments.sh).
    #   - the first CI run IS the verification: these 38 pass on this box, and
    #     nobody has yet observed them on a GitHub runner.
    name: Codegen build + tests (LLVM 17) — NOT the parity suite
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> "$GITHUB_ENV"

      # No toolchain is named here on purpose. `rust-toolchain.toml` is the one
      # place that says which toolchain this repo builds with, and `rustup
      # toolchain install` with no argument reads it — channel, components and
      # targets together. Naming `@stable` here is what made CI and developers
      # disagree about rustfmt, which is how 37 files of formatting drift
      # accumulated with nobody editing them.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cg-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cg-

      - name: cargo build (codegen)
        run: cargo build -p axon-core

      # The parity + capability integration tests. This is the job that would
      # have caught the sandbox-escape defects this audit found by hand.
      - name: cargo test (codegen)
        run: cargo test -p axon-core
