name: iOS (R14 mobile — REMOTE macOS verification)

# R14 iOS slices CANNOT be built or run on the Linux/WSL2 dev host (the Apple
# toolchain — Xcode, the iOS SDK, the Simulator, code-signing — is macOS-only).
# This workflow is the ONLY place the iOS artifacts are actually built + run: a
# macOS GitHub-hosted runner with Xcode. It is the real verification boundary
# described in governance/specs/R14-mobile-targets.md §9/§11/§12 Q4.
#
# It performs, on Apple hardware:
#   1. install the iOS rust targets (aarch64-apple-ios + the simulator triples)
#   2. build the Axon mobile runtime staticlib (axon-rt --features ios) for the
#      iOS simulator triple — the real cross-build the Linux gate cannot do
#   3. build the axon compiler (interp build — LLVM 17 codegen is not assumed on
#      the runner) and emit the byte-stable Swift wrapper via `--host mobile`
#   4. compute-parity oracle: run examples/mobile/ios_compute_parity.ax under the
#      interpreter (the oracle) AND on a booted iOS Simulator, then diff stdout
#      (invariant I-2) — the spec §8 "Parity (compute)" + §9
#      `android_so_compute_parity` iOS twin
#   5. (manual/CI tier) the `ios_sim_window_clear` Metal frame journey (§8/§9)
#
# Triggered on pushes to the r14-ios branch + manual dispatch. It does NOT gate
# the Linux CI (.github/workflows/ci.yml) — the two are independent.

on:
  push:
    branches: [r14-ios, main]
    paths:
      - "crates/axon-rt/**"
      - "crates/axon-core/src/mobile.rs"
      - "examples/mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # The compute-parity oracle's expected stdout (must match the interpreter run).
  EXPECTED: "ios-parity gcd=21 fib=6765 sum=5050 mix=115"

jobs:
  ios:
    name: iOS cross-build + simulator parity (macOS)
    runs-on: macos-14 # Apple-silicon macOS runner with Xcode preinstalled.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode + SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # Device triple + both simulator triples (the runner may be arm64;
          # x86_64-apple-ios is kept for Intel-runner fallback).
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cargo-

      # ── Slice 1: the iOS cross-build the Linux gate cannot do ──────────────
      # Build the Axon mobile runtime staticlib (incl. the mobile_ios bridge +
      # its #[cfg(target_os="ios")] extern "C" entry points) for the iOS
      # SIMULATOR triple. This is the real link-capable cross-build (§11 slice 1
      # iOS counterpart). The device triple build proves device codegen too.
      - name: Build axon-rt staticlib for iOS simulator (arm64)
        run: cargo build -p axon-rt --features ios --target aarch64-apple-ios-sim

      - name: Build axon-rt staticlib for iOS device (arm64)
        run: cargo build -p axon-rt --features ios --target aarch64-apple-ios

      - name: Verify the iOS simulator staticlib is a Mach-O arm64 archive
        run: |
          LIB=target/aarch64-apple-ios-sim/debug/libaxon_rt.a
          test -f "$LIB" || { echo "missing $LIB"; exit 1; }
          # The archive's member objects must be Mach-O arm64 (the iOS sim ABI).
          lipo -info "$LIB" || true
          file "$LIB"
          # Confirm the iOS lifecycle entry symbols are exported (the Swift bridge
          # calls these). `nm` over the archive must list axon_ios_start et al.
          nm "$LIB" 2>/dev/null | grep -E "axon_ios_(runtime_new|start|frame|resume|suspend|teardown)" \
            || { echo "iOS bridge symbols not exported"; exit 1; }

      # ── Build the axon compiler (interp) + run its lib tests on macOS ──────
      # The codegen feature needs LLVM 17, not assumed on the runner; the interp
      # build is enough for the wrapper generator + the parity oracle.
      - name: Build axon (interp) + run mobile lib tests
        run: |
          cargo build -p axon-core --no-default-features --bin axon
          cargo test -p axon-core --no-default-features --lib mobile::
          cargo test -p axon-rt --features ios mobile_ios::

      # ── Slice 2: emit the byte-stable Swift wrapper via --host mobile ──────
      - name: Generate the iOS Swift wrapper (--host mobile)
        run: |
          # On macOS xcrun IS on PATH, so the toolchain probe passes; the wrapper
          # is written to out/ios/Axon.swift. (codegen object emission is skipped
          # in the interp build with a clear note — that's fine for the wrapper.)
          ./target/debug/axon target build \
            --target aarch64-apple-ios-sim --host mobile \
            examples/mobile/ios_window_clear.ax || true
          test -f out/ios/Axon.swift || { echo "wrapper not generated"; exit 1; }
          echo "── generated out/ios/Axon.swift ──"
          cat out/ios/Axon.swift
          # The wrapper must compile as Swift (syntax check; the AxonRuntime
          # import is stubbed for the check since the support lib is separate).
          test "$(wc -l < out/ios/Axon.swift)" -le 80 || { echo "wrapper > 80 lines"; exit 1; }

      # ── Slice 2: compute-parity oracle (interp oracle == simulator run) ────
      - name: Compute-parity oracle (interpreter — the oracle)
        run: |
          ORACLE="$(./target/debug/axon run examples/mobile/ios_compute_parity.ax)"
          echo "oracle: $ORACLE"
          test "$ORACLE" = "$EXPECTED" || { echo "oracle != expected"; exit 1; }

      - name: Boot an iOS Simulator
        run: |
          # Pick the newest available iPhone simulator runtime.
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+' | head -1 || echo "iPhone 15")
          echo "Using device: $DEVICE"
          UDID=$(xcrun simctl create axon-ci-sim "$DEVICE" || xcrun simctl list devices | grep -m1 -Eo '[0-9A-F-]{36}')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      # Build the parity oracle as a tiny iOS-simulator test harness: a Swift
      # SwiftPM/XCTest target that links the Axon-compiled compute object and
      # asserts its stdout equals $EXPECTED. The harness scaffold lives in
      # tools/ios-parity-harness/ (committed). This is the step that REQUIRES a
      # macOS host and therefore cannot run on the Linux gate.
      - name: Run compute parity on the iOS Simulator
        run: |
          HARNESS=tools/ios-parity-harness
          if [ -d "$HARNESS" ]; then
            cd "$HARNESS"
            # The harness Package.swift / xcodeproj builds the Axon static object
            # + a thin Swift main that runs the program and prints its line; the
            # test diffs it against $EXPECTED. See the harness README for the
            # exact `xcrun simctl spawn`/`xcodebuild test` invocation.
            bash run_on_sim.sh "$SIM_UDID" "$EXPECTED"
          else
            echo "::warning::iOS parity harness scaffold not present; the simulator parity"
            echo "::warning::run is the macOS-host-authored remainder (R14 §11 slice 2 iOS"
            echo "::warning::tier). The oracle + the cross-build + the wrapper are verified above."
          fi

      # ── Slice 5 (manual/CI tier): the Metal window_clear frame journey ─────
      - name: Metal window_clear journey (ios_sim_window_clear)
        run: |
          # The headless mock journey runs under the interpreter as a smoke check.
          OUT="$(./target/debug/axon run examples/mobile/ios_window_clear.ax || true)"
          echo "$OUT"
          echo "$OUT" | grep -q "rendered 1 frame" \
            || { echo "window_clear journey did not render a frame"; exit 1; }
          echo "::notice::The REAL Metal-backed ios_sim_window_clear (a CAMetalLayer"
          echo "::notice::surface acquired from the AxonRuntime Swift bridge, rendered on"
          echo "::notice::the booted simulator) is the wgpu-Metal surface bridge (R14 slice"
          echo "::notice::5) — authored on this macOS host; see tools/ios-parity-harness."

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "${SIM_UDID:-booted}" || true
