[workspace]
members = [
  "crates/axon-core",
  "crates/axon-audit",
  "crates/axon-cortex",
  "crates/axon-loop-contracts",
  "crates/axon-workspace-recipe",
  "crates/axon-psv",
  "crates/axon-loop",
  "crates/cortex-policy-adapter",
  "crates/axon-reflex",
  "crates/axon-rt",
  "crates/axon-ai",
  "crates/axon-surface",
  "crates/axon-wasm",
  "crates/axon-web",
  "crates/axon-ledger",
  "crates/axon-signal",
  "crates/axon-gfx-mock",
  "crates/axon-gfx",
  "crates/axon-domain",
  "crates/axon-os",
  "crates/axon-intent",
  "crates/axon-certcheck",
  "crates/axon-guest-init",
  "crates/axon-vm",
  "crates/axon-guest-kernel",
  "crates/axon-attest",
  "crates/axon-fabric",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["cklaus"]
license = "MIT"

[workspace.dependencies]
logos = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# axon-guest-init is a static PID-1 binary — optimize for size, not speed.
# panic = "abort" cannot be set per-package; the VM crashes cleanly either way.
[profile.release.package.axon-guest-init]
opt-level = "s"

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 16

# SHA-256 at opt-level 0 hashes ~80 MB/s: every digest a debug Fabric, its
# helper or a test takes of a debug binary (the interpreter is ~80 MB) cost
# ~1 s, and the axon-fabric suite takes hundreds of them
# (governance/notes/v022-fabric-suite-time.md). Optimized, the same code
# hashes the same bytes to the same digest ~30x faster. Only the dependency's
# codegen changes; no workspace crate is optimized, so what a test or a
# mutation exercises is compiled exactly as before.
[profile.dev.package.sha2]
opt-level = 3
