[package]
name = "axon-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "axon"
path = "src/main.rs"
# No required-features: the recommended dev build is feature-light and fast —
#   cargo build -p axon-core --no-default-features --bin axon
# run/check/test/fmt/doc execute via the interpreter. `axon build` (native AOT)
# needs the `codegen` feature; `axon parse`/`lsp` (JSON) need `serde-json`.

# Codegen-free runner — builds without inkwell/LLVM, so it compiles in seconds.
# `cargo build -p axon-core --no-default-features --bin axon-run`
[[bin]]
name = "axon-run"
path = "src/bin/axon-run.rs"

[lib]
name = "axon_core"
path = "src/lib.rs"

[features]
# `serde-json` is NOT in default: it derives Serialize/Deserialize on the
# recursive AST enums (ast.rs Expr/AxonType/Pattern, `#[serde(tag="kind")]`),
# and that derive COLLIDES with the `codegen` feature monomorphizing over the
# same recursive types — rustc's monomorphization collector then recurses
# pathologically and the native build never finishes (see BUILD_RESOLVED.md).
# Keeping them apart by default makes `cargo build` (codegen) finish in ~3s.
# `axon parse`/`lsp` (JSON) opt in with `--features serde-json` and degrade
# gracefully without it.
default = ["codegen"]
# `which` (native-linker discovery) is only used by codegen's link step, so it
# rides with the codegen feature. This keeps the no-default-features interpreter
# build free of `which` — which fails to compile for wasm32-unknown-unknown (the
# browser target), the precondition for the in-browser interpreter (R7c).
codegen = ["dep:inkwell", "dep:which"]
serde-json = ["dep:serde"]
# Live LLM calls for the interpreter's ASI builtins (ai_complete / ai_extract_*).
# Pulls in axon-ai (reqwest). Opt-in so the base interpreter stays dependency-light:
#   cargo build -p axon-core --no-default-features --features asi-runtime --bin axon-run
asi-runtime = ["dep:axon-ai", "dep:reqwest"]
# SMT-backed @[verify] static proof (R9). Pulls in the `z3` crate (links the
# system libz3). OFF by default — the proof path is opt-in so the default
# codegen/interp build never links z3 (same dependency-isolation discipline as
# asi-runtime / serde-json):
#   cargo build -p axon-core --no-default-features --features smt --bin axon
smt = ["dep:z3", "dep:axon-certcheck"]
# R13 slice 5: back `use native::gfx` with the REAL `axon-gfx` wgpu offscreen
# renderer instead of the GPU-free mock. OFF by default — pulls in wgpu, so the
# default `cargo build`/`gate.sh` never compiles it and stays fast. When on, the
# interpreter routes `gfx::*` to the real headless GPU backend (verified on Mesa
# lavapipe). Codegen path is unchanged (it links the axon-rt mock symbols).
#   cargo build -p axon-core --no-default-features --features gfx-wgpu --bin axon-run
gfx-wgpu = ["dep:axon-gfx"]

[dependencies]
logos = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
inkwell = { version = "0.4", features = ["llvm17-0"], optional = true }
which = { version = "6", optional = true }
sha2  = "0.10"
# SMT solver bindings (R9, `smt` feature only). Links the system libz3.
z3 = { version = "0.12", optional = true }
axon-ai = { path = "../axon-ai", optional = true }
# R23: the SOLVER-FREE certificate checker. Behind `smt` (the proof path); the
# `check` we use pulls NO solver — Z3 stays out of the trust root.
axon-certcheck = { path = "../axon-certcheck", optional = true, default-features = false }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
# Phase-10 surface compiler (goal.md → .ax), for the `axon goal` command.
axon-surface = { path = "../axon-surface" }
# R13 slice 4: the shared `native::gfx` mock impl — the SAME crate axon-rt links
# for codegen, so the interpreter drives the identical Rust dispatch (one impl,
# two engines, I-2 by construction modulo marshalling).
axon-gfx-mock = { path = "../axon-gfx-mock" }
# R13 slice 5: the REAL wgpu offscreen renderer (the `gfx-wgpu` feature only).
axon-gfx = { path = "../axon-gfx", optional = true }

# R22 — domain-interop native modules (`native::modbus`/`fhir`/`fix`). These are
# INTERP-SIDE only (codegen E0910-refuses the network ones), so axon-domain is a
# plain interp dependency; it is NOT in axon-rt and contributes no extern
# symbols. Its heavy deps (tokio-modbus/reqwest/socket2/serde_json) DO NOT build
# for wasm32-unknown-unknown (the in-browser interpreter target, R7c), so the
# dep is gated to non-wasm targets — keeping the browser interp build clean,
# exactly as `which` rides only with codegen. The interp wiring in `interp.rs`/
# `eval.rs` is `#[cfg(not(target_arch = "wasm32"))]`; on wasm a `native::modbus`
# call surfaces as a clean "unavailable on this target" runtime refusal (the
# modules are native-host-only by nature — no TCP/HTTP in the browser sandbox).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axon-domain = { path = "../axon-domain" }
