[package]
name = "axon-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "axon"
path = "src/main.rs"
# No required-features: the recommended dev build is feature-light and fast —
#   cargo build -p axon-core --no-default-features --bin axon
# run/check/test/fmt/doc execute via the interpreter. `axon build` (native AOT)
# needs the `codegen` feature; `axon parse`/`lsp` (JSON) need `serde-json`.

# Codegen-free runner — builds without inkwell/LLVM, so it compiles in seconds.
# `cargo build -p axon-core --no-default-features --bin axon-run`
[[bin]]
name = "axon-run"
path = "src/bin/axon-run.rs"

[lib]
name = "axon_core"
path = "src/lib.rs"

[features]
# `serde-json` is NOT in default: it derives Serialize/Deserialize on the
# recursive AST enums (ast.rs Expr/AxonType/Pattern, `#[serde(tag="kind")]`),
# and that derive COLLIDES with the `codegen` feature monomorphizing over the
# same recursive types — rustc's monomorphization collector then recurses
# pathologically and the native build never finishes (see BUILD_RESOLVED.md).
# Keeping them apart by default makes `cargo build` (codegen) finish in ~3s.
# `axon parse`/`lsp` (JSON) opt in with `--features serde-json` and degrade
# gracefully without it.
default = ["codegen"]
codegen = ["dep:inkwell"]
serde-json = ["dep:serde", "dep:serde_json"]
# Live LLM calls for the interpreter's ASI builtins (ai_complete / ai_extract_*).
# Pulls in axon-ai (reqwest). Opt-in so the base interpreter stays dependency-light:
#   cargo build -p axon-core --no-default-features --features asi-runtime --bin axon-run
asi-runtime = ["dep:axon-ai"]

[dependencies]
logos = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true }
thiserror = { workspace = true }
inkwell = { version = "0.4", features = ["llvm17-0"], optional = true }
which = "6"
sha2  = "0.10"
axon-ai = { path = "../axon-ai", optional = true }
# Phase-10 surface compiler (goal.md → .ax), for the `axon goal` command.
axon-surface = { path = "../axon-surface" }
