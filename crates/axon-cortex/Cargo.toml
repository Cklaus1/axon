[package]
name = "axon-cortex"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Axon Cortex — typed contracts for the M0/M1 repair-episode slice (CX-00/02/03/10)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
axon-workspace-recipe = { path = "../axon-workspace-recipe" }
hex = "0.4"
# PR_SET_PDEATHSIG for the check worker (G13-r22-restart-matrix): a worker must not
# outlive the supervisor that journalled its launch.
libc = "0.2"
# The `cmd:` generator runs as a process-group job, killed whole at its deadline
# (KG2), and `cortex` forwards termination signals to it (KG3).
axon-jobctl = { path = "../axon-jobctl" }
# The strict JSON decode (`parse_strict`'s duplicate-key visitor) lives in the
# cl22 leaf crate, one definition for every crate that reads protocol JSON.
axon-canonical = { path = "../axon-canonical" }
axon-ai = { path = "../axon-ai", optional = true }
# NH-R1: the repair-envelope verifier and spent store (`axon-approval/4`).
axon-os = { path = "../axon-os", optional = true }

[features]
default = []
# A model-backed patch generator. Off by default: a controller that could not
# be built without a model dependency would make the model load-bearing for
# every part of it that does not need one.
ai = ["dep:axon-ai"]
# NH-R1 `cortex repair --unattended` (tasks/unattended-auth-spec.md §5.3).
# Off by default: a build without it refuses `--unattended` (exit 29). The
# envelope signature (ring) comes with axon-os; cl22 is already a dependency.
unattended = ["dep:axon-os", "ai"]

[dev-dependencies]
# tests/unattended.rs signs an envelope `MintKey::sign` refuses (a relative pin,
# security F4) to show phase A refuses it too: the same seed and signature as axon-os.
axon-attest = { path = "../axon-attest" }
ring = "0.17"
