[package]
name = "axon-fabric"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Axon compute fabric (v0.22 M1): durable operation journal, aggregate reservations, and the Fabric submit path"

[[bin]]
name = "axon-fabric"
path = "src/bin/axon-fabric.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# Ed25519 verification of qualification evidence (decision D6). Already in
# the workspace lockfile via rustls; no new crate.
ring = "0.17"
axon-loop-contracts = { path = "../axon-loop-contracts" }
axon-loop = { path = "../axon-loop" }
axon-cortex = { path = "../axon-cortex" }
axon-os = { path = "../axon-os" }
axon-vm = { path = "../axon-vm" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
