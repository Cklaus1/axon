[package]
name = "axon-intent"
version = "0.1.0"
edition = "2021"
description = "Axon intent→approve gateway (R22) — prose intent → proven-bounded job"

[[bin]]
name = "axon-intent"
path = "src/main.rs"

[lib]
name = "axon_intent"
path = "src/lib.rs"

[features]
# Exposes `MockSynth` to integration tests / external callers (the unit tests
# get it via cfg(test) automatically).
mock = []
# IG3: the `--generator ai:<model>` generator, through axon-ai.
ai = ["dep:axon-ai"]

[dependencies]
axon-os = { path = "../axon-os" }
# IG0: synth's write-target / stub / entry analysis walks the parsed program
# and reads the compiler's one admission-axes table. The interpreter build.
axon-core = { path = "../axon-core", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A `cmd:` generator runs as a process-group job (axon-os `run_bounded_job`):
# its deadline kills the whole job, and `main` forwards termination signals.
axon-jobctl = { path = "../axon-jobctl" }
axon-ai = { path = "../axon-ai", optional = true }

[dev-dependencies]
# kill(2) and /proc liveness in the signal test (tests/signals.rs).
libc = "0.2"
