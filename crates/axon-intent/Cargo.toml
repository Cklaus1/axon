[package]
name = "axon-intent"
version = "0.1.0"
edition = "2021"
description = "Axon intent→approve gateway (R22) — prose intent → proven-bounded job"

[[bin]]
name = "axon-intent"
path = "src/main.rs"

[lib]
name = "axon_intent"
path = "src/lib.rs"

[features]
# Exposes `MockSynth` to integration tests / external callers (the unit tests
# get it via cfg(test) automatically).
mock = []

[dependencies]
axon-os = { path = "../axon-os" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
