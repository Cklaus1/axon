[package]
name = "axon-ledger"
version = "0.1.0"
edition = "2021"
description = "Provenance ledger for AI-coding teams — links git commits to the agent sessions that produced them"
license = "MIT"
repository = "https://github.com/cklaus/axon"
keywords = ["provenance", "git", "ai", "claude", "audit"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "axon-ledger"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
