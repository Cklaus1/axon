[package]
name = "axon-loop-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Axon Cortex v0.22 closed-loop shared contracts: pure types, strict parsing, cl22 canonical digest, no-I/O semantic checks"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Ed25519 for verifier-receipt attestations (G01-r22-independent-issuer).
# Already in the workspace lockfile (axon-fabric, rustls); no new crate.
ring = "0.17"
axon-cortex = { path = "../axon-cortex" }
# The PSV formats (launch manifest, preflight observation) the protected
# joins verify (v022-psv-protocol.md §9, review wf_d725935a-7ed B2).
axon-psv = { path = "../axon-psv" }

[features]
# TESTS ONLY: `operator_trust::set_test_root`. Enabled only as a
# dev-dependency feature; a production build never contains the setter.
test-trust-root = []
