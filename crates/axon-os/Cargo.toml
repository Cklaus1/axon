[package]
name = "axon-os"
version = "0.1.0"
edition = "2021"
description = "Axon OS containment supervisor — run untrusted programs under a proven capability bound (R21)"

[[bin]]
name = "axon-os"
path = "src/main.rs"

[lib]
name = "axon_os"
path = "src/lib.rs"

[features]
# Exposes `MockRuntime` to integration tests / external callers (the unit
# tests get it via cfg(test) automatically).
mock = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R28: capability audit ledger — for `axon-os audit verify/show` subcommands.
axon-audit = { path = "../axon-audit" }

[dev-dependencies]
