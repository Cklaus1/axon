[package]
name = "axon-psv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Protected suite-verdict protocol: launch manifest, completion key, input check, guest verdict (shared by Fabric and the guest runner)."

[dependencies]
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
axon-workspace-recipe = { path = "../axon-workspace-recipe" }
libc = "0.2"
# The runner decodes the guest policy from its kernel-cmdline word (PSV-6, A87).
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
