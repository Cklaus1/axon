[package]
name = "axon-rt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]  # Link into axon binaries as a native static lib.
name = "axon_rt"

[features]
# R14 iOS slices: opt-in marker that the `axon-rt` build is targeting iOS. The
# cross-platform `AxonRuntime` lifecycle CORE (`mobile_ios::runtime`) compiles on
# EVERY host (so its tests run on the Linux gate); only the `#[no_mangle] extern
# "C"` entry points the Swift app calls are additionally `cfg(target_os="ios")`-
# gated, so Linux never emits them. This feature is OFF by default — the Linux
# `gate.sh` never sets it, so it cannot regress the Linux build.
ios = []

[dependencies]
# R13 slice 4: the shared `native::gfx` mock impl (one impl, two engines). The
# `#[no_mangle] extern "C"` `__axon_gfx_*` symbols in gfx_mock_ffi wrap it.
axon-gfx-mock = { path = "../axon-gfx-mock" }

# Unix-only: the SIGSEGV/altstack handler that turns a stack overflow (deep
# recursion) into a graceful exit-101 panic instead of a raw SIGSEGV (139). Not
# pulled on wasm/Windows — the guard is a no-op there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WASI has a libc too, and `random_*` needs `srand` there for the same reason
# it needs it on unix: codegen lowers the builtin to a bare `rand()`, so
# without seeding the artifact returns one fixed sequence forever. Measured on
# wasm32-wasip1 before this: the same two values (1, 883707) on every run and
# under every AXON_SEED. Not pulled for wasm32-unknown-unknown, which has no
# libc and no clock to seed from.
[target.'cfg(target_os = "wasi")'.dependencies]
libc = "0.2"
