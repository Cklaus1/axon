[package]
name = "axon-surface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Axon Phase-10 prose-to-AST compiler — turns goal.md into goal.ax"

[lib]
name = "axon_surface"
path = "src/lib.rs"

[[bin]]
name = "axon-surface"
path = "src/main.rs"
required-features = ["cli"]

[features]
# `cli` (default) pulls clap for the `axon-surface` binary. The LIBRARY
# (parser + compile) is clap-free, so a dependent that turns defaults off — e.g.
# axon-wasm, which compiles the surface compiler into the wasm32 playground —
# gets the pure prose→AST core with no CLI/terminal deps.
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
thiserror.workspace = true
anyhow = "1"
