\* TLC config for R27KillSwitch.tla -- WIDEN variant: a smaller model (3
\* principals, coalition bounded to 1). 1*2=2 < 3 still satisfies the
\* module's ASSUME. Checking two differently-sized models (this file and
\* R27KillSwitch.cfg's 5-principal / CoalitionMax=2 model) is the R32 Gate-4
\* WIDEN step -- catching model errors that only show up at one size (e.g.
\* an off-by-one in the majority calibration, or a state-space explosion
\* that silently truncates TLC's search at the larger size).
\*
\* Run (when TLC is installed):
\*   java -jar tla2tools.jar governance/proofs/R27KillSwitch.tla \
\*        -config governance/proofs/R27KillSwitch-3principals.cfg -workers auto

CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  Principals = {p1, p2, p3}
  CoalitionMax = 1

INIT Init
NEXT Next

INVARIANT TypeInvariant
INVARIANT KillFiresWithin2Polls

PROPERTY KillLatchMonotone
PROPERTY ContainedCannotDisableKill

CHECK_DEADLOCK FALSE
