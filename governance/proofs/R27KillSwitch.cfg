\* TLC config for R27KillSwitch.tla -- "main" model size: 5 principals,
\* coalition bounded to 2 (2*2=4 < 5, satisfies the module's ASSUME that the
\* coalition can never reach a majority).
\*
\* Run (when TLC is installed):
\*   java -jar tla2tools.jar governance/proofs/R27KillSwitch.tla \
\*        -config governance/proofs/R27KillSwitch.cfg -workers auto

CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  p4 = p4
  p5 = p5
  Principals = {p1, p2, p3, p4, p5}
  CoalitionMax = 2

INIT Init
NEXT Next

INVARIANT TypeInvariant
INVARIANT KillFiresWithin2Polls

PROPERTY KillLatchMonotone
PROPERTY ContainedCannotDisableKill

CHECK_DEADLOCK FALSE
